# Settings of the test PostgreSQL that `make test-focused` starts, locally and in CI.
# One `name = value` per line; the Makefile passes each as a `-c` option, so values
# have no spaces or quotes. Give each setting its reason.

# Test data is disposable, and every DROP DATABASE waits for a checkpoint: with fsync
# a run can stall for minutes.
fsync = off
# Tests that prove a statement's cost read its statistics (docs/development/database.md).
shared_preload_libraries = pg_stat_statements
# Bound WAL and one query's temporary files: test data is small.
max_wal_size = 256MB
temp_file_limit = 4GB
